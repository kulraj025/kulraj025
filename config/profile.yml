# Profile configuration for kulraj025
# All dynamic GitHub data is fetched live by scripts/generate_profile.py.
# Only identity, education, and visual theme are configured here.

profile:
  display_name: Kulraj Neupane
  tagline: Building with AI · 3rd Year · 6th Semester
  bio: From "Hello World" to the real world — I build useful digital experiences, experiment with AI, and turn ideas into working products.
  location: Busan, South Korea
  current_focus: Building AI projects · Learning machine learning

  university:
    institution: Dong-eui University
    website: https://eng.deu.ac.kr/eng/index.do
    city: Busan
    country: South Korea

  education:
    - degree: B.Sc. (Hons)
      specialization: Intelligence Computing
      level: 3rd Year · 6th Semester
      institution: Dong-eui University
      status: Currently Enrolled

projects:
  # Rendered by scripts/build_readme.py as a visual grid: the first entry is
  # full width, the rest pair up two per row. Order here is display order.
  #
  # `summary` is the one line of copy. It is curated rather than taken from the
  # repository description, because those are one sentence of marketing or, in
  # one case, literally "x". `stack` is the visible chip row.
  #
  # `title` is spelled out because deriving it from the repository name mangles
  # the branding: `skillbridge` auto-cases to "Skillbridge" and
  # `helping-station-deu` to "Helping Station Deu".
  #
  # Nothing about the layout is hardcoded: a project with no verified demo simply
  # gets no Live badge, and adding a fourth project pairs it up automatically.
  featured:
    - name: skillbridge
      title: SkillBridge
      subtitle: EXPLAINABLE
      summary: Explainable skill-to-role matching. Rules first. Runs locally.
      stack: [Python, FastAPI, Pydantic, Docker, pytest]
    - name: helping-station-deu
      title: Helping Station DEU
      subtitle: VERIFIABLE
      summary: Verifiable campus lucky draw. Append-only log.
      stack: [TypeScript, Next.js, Prisma, PostgreSQL]
    - name: campus_connect_x_v2
      title: Campus Connect X v2
      subtitle: DEPLOYED
      summary: Campus announcements in one app. Live.
      stack: [PHP, MySQL, HTML, CSS, JavaScript]

  # Never promoted, whatever the star count. Project1 and test.cpp are noise, and
  # the profile repository is this page rather than a portfolio piece.
  hidden_repositories:
    - Project1
    - test.cpp
    - kulraj025

  max_featured: 5
  include_archived: false
  include_forks: false

social:
  github: https://github.com/kulraj025
  website: ""
  twitter: ""
  # Clean URL only. Never store the `?stkn=` share-tracking suffix here: it is a
  # per-share token, it leaks a referral, and the brief bans tracking strings.
  instagram: https://www.instagram.com/kul_rajneupane
  email: Kulraj024@gmail.com
  # LinkedIn and Facebook were here and have been deleted rather than left
  # commented out. Both were unverifiable when checked -- the LinkedIn URL
  # returned 999 and the Facebook one 400 -- and a link that cannot be confirmed
  # to exist is worse than no link, because it is the one a reader is most
  # likely to click. The brief bans both. If a real profile is created later, add
  # it back with a URL that has been opened and checked.

theme:
  background: "#070B17"
  surface: "#0E1830"
  surface_light: "#13213B"
  cyan: "#38BDF8"
  cyan_bright: "#22D3EE"
  blue: "#38BDF8"
  violet: "#8B5CF6"
  purple: "#A78BFA"
  green: "#34D399"
  white: "#F8FAFC"
  text_2: "#CBD5E1"
  muted: "#94A3B8"
  line: "#2A3C62"

content:
  show_education: true
  show_projects: true
  show_activity: true
  show_contact: true

  # The quote under "## Note" rotates once a day.
  #
  # Not a service and not random: build_readme.py picks the entry whose index is
  # the day-of-year modulo the list length. That is a pure function of the date
  # and this file, so the page changes every day with no network call, no third
  # party that can 503, and no possibility of the same quote two days running.
  # A `random.choice` would be wrong here: it would make the build
  # non-reproducible, so `--check` could never be trusted.
  #
  # These are working principles, not testimonials. Nothing here claims a
  # result, a metric or an employer, because none of that is verifiable.
  quotes:
    - Ship the first version. Then make the reasoning inspectable.
    - Rules first, models second.
    - A log you can verify beats a claim you cannot.
    - Explainable beats impressive.
    - Build small, check everything, write down the rest.
    - If you cannot explain why it answered, you have not finished.
    - Ship it, then instrument it, then explain it.