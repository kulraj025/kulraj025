<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 132" width="700" height="132" role="img" aria-label="Campus products and explainable AI. Third year at Dong-eui University. Open to internships, Korea or remote.">
  <title>Campus products + explainable AI — 3rd year · Dong-eui University — Open to internships · Korea or remote</title>
  <desc>Three centred lines, revealed one at a time by a typewriter wipe.</desc>

  <defs>
    <clipPath id="panel"><rect x="0" y="0" width="700" height="132" rx="12"/></clipPath>

    <!-- One wipe per line. Each rect starts at that line's own left edge and grows
         rightwards, so the text is revealed left-to-right like a typewriter. The
         rect's base width is the full line width: if SMIL is blocked (some
         viewers, some mail clients) all three lines simply show at once. -->
    <clipPath id="wipe1"><rect x="119.5" y="14" width="461" height="36">
      <animate attributeName="width" values="0;0;461;461;0;0" keyTimes="0;0.02;0.1417;0.30;0.3333;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="wipe2"><rect x="134" y="48" width="432" height="36">
      <animate attributeName="width" values="0;0;432;432;0;0" keyTimes="0;0.3333;0.475;0.6333;0.6667;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="wipe3"><rect x="83.5" y="82" width="533" height="36">
      <animate attributeName="width" values="0;0;533;533;0" keyTimes="0;0.6667;0.8083;0.9667;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <!-- Own dark background: cyan on transparency disappears in light theme. -->
    <rect width="700" height="132" fill="#0B1220"/>
    <rect x="0" y="0" width="700" height="2" fill="#22D3EE" opacity="0.5"/>
  </g>

  <g font-family="'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
     font-size="24" font-weight="600" fill="#22D3EE" text-anchor="middle">

    <text x="350" y="32" clip-path="url(#wipe1)"
          textLength="461" lengthAdjust="spacingAndGlyphs">Campus products + explainable AI</text>

    <text x="350" y="66" clip-path="url(#wipe2)"
          textLength="432" lengthAdjust="spacingAndGlyphs">3rd year · Dong-eui University</text>

    <text x="350" y="100" clip-path="url(#wipe3)"
          textLength="533" lengthAdjust="spacingAndGlyphs">Open to internships · Korea or remote</text>
  </g>
</svg>
