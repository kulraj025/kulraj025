<svg xmlns='http://www.w3.org/2000/svg' width='646' height='140' viewBox='0 0 646 140' role='img' aria-label='Profile statistics'>
    <defs>
    <linearGradient id='bgGrad' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#0B0E17'/>
      <stop offset='100%' stop-color='#0F1422'/>
    </linearGradient>
    <linearGradient id='accentGrad' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#06B6D4'><animate attributeName='stop-color' values='#06B6D4;#7C3AED;#06B6D4;#06B6D4' dur='16s' repeatCount='indefinite'/></stop>
