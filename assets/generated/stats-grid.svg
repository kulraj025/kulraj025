    </linearGradient>
    <linearGradient id='glow' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#06B6D4'/>
      <stop offset='100%' stop-color='transparent'/>
    </linearGradient>
  </defs>
