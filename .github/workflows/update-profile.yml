name: Update Profile README

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: refresh') }}"
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install PyYAML pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Generate profile assets and README
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile.py

      - name: Validate profile
        run: python scripts/validate_profile.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — profile is up to date."
          else
            git commit -m "chore: refresh profile README from GitHub activity"
            git push
          fi
