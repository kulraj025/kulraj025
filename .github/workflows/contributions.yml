name: Contribution Data Refresh

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install PyYAML

      - name: Generate contribution heatmap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "
          from scripts.github_api import GitHubAPI
          from scripts.generate_svg_assets import build_contributions_static, ASSETS_DIR
          api = GitHubAPI()
          events = api.public_events('kulraj025', per_page=60) or []
          theme = {
              'background': '#070B17', 'surface': '#0D1528',
              'cyan': '#22D3EE', 'violet': '#8B5CF6',
              'white': '#F8FAFC', 'muted': '#94A3B8',
              'green': '#34D399', 'blue': '#38BDF8',
          }
          svg = build_contributions_static(theme, events)
          (ASSETS_DIR / 'contributions.svg').write_text(svg, encoding='utf-8')
          print('Updated contribution visualization')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/contributions.svg
          if git diff --cached --quiet; then
            echo "Contributions up to date."
          else
            git commit -m "chore: refresh contribution heatmap"
            git push
          fi
