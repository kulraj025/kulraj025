# Validates the hand-maintained profile README.
#
# This used to run the SVG generator and its geometry/raster QA. That generator no
# longer writes README.md, so those checks would fail on every push. What is checked
# now is the README itself.
#
# Runs the structural validator AND the test suite, which includes the hero crop
# test: it rasterises assets/banner.svg and assets/typing.svg and measures the
# actual ink margins, because a clipped heading is not something a regex can see.
#
# External image reachability is reported but never fails the build: the stats,
# streak, badge and skill-icon services are third-party, and their outages are not
# a defect in this repository.

name: Validate Profile

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: validate-profile
  cancel-in-progress: true

jobs:
  readme:
    name: README structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML and pytest
        run: |
          pip install --quiet PyYAML pytest
          # The hero crop test rasterises the text layer and measures real ink
          # margins, which is the only way to prove a letter cannot be clipped.
          sudo apt-get update --quiet
          sudo apt-get install --quiet --yes librsvg2-bin

      - name: Validate README structure and workflow YAML
        run: python3 scripts/validate_readme.py --check-workflows

      - name: README and cards are internally consistent
        # The drift guard, and it is deliberately OFFLINE.
        #
        # An earlier version re-rendered both from the API and compared byte for
        # byte. It was red on almost every run, for reasons that had nothing to do
        # with the code: GitHub's commit-search index lagged the repository (it
        # read 37 commits while the repository had 40) and Linguist re-analyses
        # asynchronously after a push, so the language card changed minutes after
        # an otherwise identical build. A permanently-red check is worse than no
        # check, because the only rational response to one is to stop reading it.
        #
        # So each check now verifies what is actually stable:
        #   build_readme.py --check  the committed README matches the template,
        #                           with the two generated regions taken from the
        #                           committed file. Catches a hand-edited README, a
        #                           template edited without rebuilding, an unfilled
        #                           slot, a changed config value.
        #   render_stats.py --check  each card parses, has its own opaque
        #                           background, has a title, holds no placeholder,
        #                           has descending shares that sum to 100, and
        #                           agrees with the README alt text describing it.
        #
        # No token is needed, because neither step makes a request. The numbers
        # are owned by the daily run in profile-widgets.yml, which rewrites the
        # cards and the README on a schedule.
        run: |
          python3 scripts/render_stats.py --check
          python3 scripts/build_readme.py --check

      - name: Test suite
        run: python3 -m pytest tests/ -q

      - name: Audit external image availability
        continue-on-error: true
        run: python3 scripts/validate_readme.py --check-external
