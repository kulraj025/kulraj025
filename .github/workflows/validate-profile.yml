# Validates the hand-maintained profile README.
#
# This used to run the SVG generator and its geometry/raster QA. That generator no
# longer writes README.md, so those checks would fail on every push. What is checked
# now is the README itself.
#
# External image reachability is reported but never fails the build: the streak card,
# typing SVG, badges and skill icons are third-party services, and their outages are
# not a defect in this repository.

name: Validate Profile

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: validate-profile
  cancel-in-progress: true

jobs:
  readme:
    name: README structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet PyYAML

      - name: Validate README structure and workflow YAML
        run: python3 scripts/validate_readme.py --check-workflows

      - name: Audit external image availability
        continue-on-error: true
        run: python3 scripts/validate_readme.py --check-external
