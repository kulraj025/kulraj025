# Contribution graphics for the profile README.
#
# WHAT THIS DOES
#   1. Platane/snk          -> contribution snake, published to the `output` branch
#   2. yoshi389111/...3d    -> 3D contribution calendar, committed to `main`
#   Both are referenced by README.md, in the hero block and under "## Activity".
#
# NOTE ON THE TWO ACTION INTERFACES -- they are not alike, and guessing breaks the
# run before a single step executes:
#   * snk takes `with:` inputs (github_user_name, outputs) and writes the SVGs into
#     the working tree. It does NOT commit and does NOT create the output branch,
#     but it still exits 0. The commit step below is what publishes it.
#   * github-profile-3d-contrib takes ENVIRONMENT VARIABLES (GITHUB_TOKEN,
#     USERNAME), not `with:` inputs, and does NOT commit. You commit it yourself.
#     Passing `with: user_name:` to it silently does nothing.
#
# HOW TO ENABLE  (first time only -- about two minutes)
#   1. Open this repository on GitHub -> the "Actions" tab.
#   2. If GitHub shows a banner saying workflows are disabled, click "I understand,
#      enable them". Nothing works until you do this.
#   3. Confirm the repository setting:
#         Settings -> Actions -> General -> "Read and write permissions"
#      must be "Read and write permissions", not "Read repository contents
#      permissions". Both generators write files back to the repository.
#   4. Click "Generate Contribution Graphics" in the Actions sidebar -> "Run workflow".
#      The first run takes 2-5 minutes: it has to clone the full contribution
#      history, which is slow the first time because nothing is cached.
#   5. A daily schedule keeps both graphics current after that, so there is never a
#      reason to run this by hand again.
#
# IF A GRAPH DOES NOT APPEAR
#   The README references these two paths. Both carry alt text and a Fallback
#   comment, so a missing graphic degrades to a sentence rather than a broken icon:
#       output/github-contribution-grid-snake.svg
#       profile-3d-contrib/profile-night-green.svg

name: Generate Contribution Graphics

on:
  schedule:
    # 01:17 UTC daily. Deliberately not midnight: every scheduled job on GitHub
    # fires at :00 and the queue backs up for several minutes afterwards.
    - cron: "17 1 * * *"
  # Manual re-run from the Actions tab, plus one automatic run on the first push so
  # the graphics exist as soon as this file lands in the repository.
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-widgets.yml"

# Required: the 3D generator's commit step below pushes to main.
permissions:
  contents: write

# One run at a time. Overlapping runs would race on the same generated files.
concurrency:
  group: contribution-graphics
  cancel-in-progress: true

jobs:
  graphics:
    name: Snake and 3D calendar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The 3D commit step below pushes to main and needs credentials.
          persist-credentials: true

      # svg-only variant: this README embeds SVG, and skipping the GIF render is
      # noticeably faster. Writes into the working tree; the commit step below
      # publishes it to the `output` branch.
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kulraj025
          # Bare filenames, NOT an "output/" prefix. In a raw.githubusercontent URL
          # the segment after the repository name is the BRANCH, so
          #   .../kulraj025/kulraj025/output/github-contribution-grid-snake.svg
          # means branch "output", file "github-contribution-grid-snake.svg" at the
          # repository root. That is snk's convention too: its own output branch
          # holds nothing but the snake files. The dark variant needs a palette.
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      # This action is configured entirely through environment variables, and it
      # writes every theme it knows into profile-3d-contrib/ without committing.
      - name: Generate the 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: kulraj025

      # ORDER MATTERS. The snake commit below switches branches, so anything that
      # pushes to main has to happen first.

      - name: Commit the 3D calendar to main
        run: |
          # Only the one file the README references is tracked. The action emits
          # ~19 theme variants, most of them unused, and committing all of them
          # would add megabytes to a profile repository on every single run.
          # .gitignore ignores the rest.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-green.svg
          if git diff --cached --quiet; then
            echo "3D calendar unchanged."
          else
            git commit -m "chore: refresh 3D contribution calendar"
            git push origin HEAD:main
          fi

      # snk writes its SVGs into the working tree and exits 0. It does NOT commit
      # and does NOT create the branch, so a run that trusts it looks green while
      # every snake URL 404s. Verified: the first run reported success and left no
      # `output` branch at all.
      #
      # Built with plumbing rather than by checking the branch out, for two reasons:
      # the working tree is not disturbed (the 3D commit above already pushed), and
      # the branch ends up holding only the two SVGs, which is what snk's own output
      # branch looks like. Checking out a branch here would drag the entire
      # repository along with it.
      - name: Publish the snake to the output branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          light=github-contribution-grid-snake.svg
          dark=github-contribution-grid-snake-dark.svg
          for f in "$light" "$dark"; do
            [ -s "$f" ] || { echo "::error::$f was not generated"; exit 1; }
          done

          b_light=$(git hash-object -w "$light")
          b_dark=$(git hash-object -w "$dark")
          tree=$(printf '100644 blob %s\t%s\n100644 blob %s\t%s\n' \
            "$b_light" "$light" "$b_dark" "$dark" | git mktree)
          commit=$(git commit-tree "$tree" -m "chore: refresh contribution snake")

          # --force: this branch is generated output only, and replacing it
          # wholesale is what keeps it from accumulating every past revision.
          git push --force origin "$commit:refs/heads/output"
          echo "published $commit to output"

      - name: Verify both graphics are reachable
        run: |
          # Cheap insurance against the failure this workflow originally had: a green
          # run that published nothing.
          #
          # Checked over raw.githubusercontent rather than the API on purpose, because
          # raw is what a reader of the README actually gets.
          #
          # NOTE: the base URL uses ${{ github.repository }} on its own. That context
          # value is ALREADY "owner/repo" -- it is not the repo name. Interpolating
          # github.repository_owner as well produces .../kulraj025/kulraj025/kulraj025/
          # and every probe 404s against a URL that does not exist, which looks
          # exactly like a publish failure. That is what this check was doing: 21
          # retries against a malformed URL, failing while all three files served
          # 200. A short retry is kept only to cover raw's propagation delay after a
          # fresh push.
          base="https://raw.githubusercontent.com/${{ github.repository }}"
          for target in \
            "output/github-contribution-grid-snake.svg" \
            "output/github-contribution-grid-snake-dark.svg" \
            "main/profile-3d-contrib/profile-night-green.svg" ; do
            code=000
            for attempt in $(seq 1 6); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/$target")
              [ "$code" = "200" ] && { echo "$target -> 200 (attempt $attempt)"; break; }
              echo "  $target -> $code, retrying ($attempt/6)"
              sleep 10
            done
            [ "$code" = "200" ] || { echo "::error::$target is not published"; exit 1; }
          done
