name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * 0"      # every Sunday at 00:00 UTC
  workflow_dispatch: {}        # allows manual trigger from the Actions tab

permissions:
  contents: write            # needed to commit the generated SVG

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: kulraj025
          outputs: |
            assets/generated/github-snake.svg
            assets/generated/github-snake-dark.svg

      - name: Commit and push the snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          if git diff --cached --quiet; then
            echo "Snake is up to date."
          else
            git commit -m "chore: update contribution snake"
            git push
          fi